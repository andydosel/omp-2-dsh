packages:
  # Every plugin directory. `plugins/dsh-vibe-mode` is GONE (deleted, not
  # excluded): its reusable worker-spawn core now lives in
  # `plugins/dsh-worker-spawn`, which a future `dsh-orchestrator`
  # (`subtask_parallel`) consumes.
  - plugins/*

# hoisted node_modules so the Cordis loader resolves each plugin's host entry
# (and the client bundles) by package name the same way the released
# ~/.dsh/profiles/web/node_modules/@dsh-plugin/ tree does.
nodeLinker: hoisted

# Pin cordis to the version the dsh 0.2.0-rc.2 monorepo vendors (4.0.4):
# every rc.2 @deepseek-ai/dsh-* package peers ~4.0.4; letting the dev
# workspace float to another 4.0.x skews the peer against the host's vendored
# version. cordis@4.0.4's own framework peers (`~1.0.5` loader, `~1.0.9`
# include) get the same treatment: the previous lockfile keeps its 0.1.1-era
# auto-installed resolutions (loader 1.0.3 + include 1.0.7, which satisfy NO
# current requirement) and would otherwise leave a second loader copy behind.
# The blanket dsh-* override pulls every transitive dsh peer (dsh-brand,
# dsh-code-runtime, dsh-session-persistence, …) to the same rc.2 the host
# builds against, so no peer is left on a stale 0.1.1-rc.2 tuple.
overrides:
  "@deepseek-ai/cordis": 4.0.4
  "@deepseek-ai/cordis-plugin-include": 1.0.9
  "@deepseek-ai/cordis-plugin-loader": 1.0.5
  "@deepseek-ai/dsh-*": 0.2.0-rc.2

# esbuild ships its platform binary via a postinstall; pnpm blocks unknown
# build scripts by default, so allow it (vitest -> vite -> esbuild).
allowBuilds:
  esbuild: true
