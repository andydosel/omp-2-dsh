# release.yml — build the dsh plugin suite on a version tag and attach the
# produced zip to the GitHub Release.
#
# Mirrors scripts/release.ps1 locally (build all 7 plugins in dependency order,
# then zip) as the "build-on-tag -> upload asset" automation path. It assumes a
# single root pnpm workspace (pnpm-workspace.yaml -> plugins/*) governing every
# plugin, and that the release tooling lives under scripts/.
name: release-suite

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # One root workspace resolves all seven plugins (compact-mode pulls
      # tree-engine via workspace:*); a single install covers the whole suite.
      - name: Install
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # Build all 7 + package the zip. Derive the bare version from the tag
      # (strip the leading 'v') so the zip and Release tag stay in lockstep.
      - name: Build and package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
          & "${{ github.workspace }}/scripts/release.ps1" -Version $ver -OutputDir "${{ github.workspace }}/release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dsh-suite-*.zip
          generate_release_notes: true
