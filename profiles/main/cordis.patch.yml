# dsh profile-main overlay: compact-mode + tool-read-write + advisor +
# mode-ui + channel-wechat(disabled), applied AFTER the dsh-base and
# dsh-web-app bundle layers (via `--patch` on the web profile, or as the user
# layer of a `main` profile installed under ~/.dsh/profiles/).
#
# ── disables ────────────────────────────────────────────────────────────────
#
# The base bundle mounts `compaction-basic` (row `compaction-basic`) and
# `command-compact` (row `command-compact`). Both must be disabled: compact-mode
# provides `ctx.compaction` (a single-backend service — a second provider is a
# hard conflict) and registers the `/compact*` command family (duplicate
# `compact` registration error otherwise). The `name` guard makes a base change
# fail loud instead of disabling the wrong row.
#
# `tool-fs` is disabled the same way. dsh-tool-read-write registers the
# same-name `read`/`write`/`edit`/`read_image` (+ `inspect_image`) tools, and a
# same-scope duplicate registration throws — so the stock row must be gone
# before the plugin applies. On the web profile the web-app bundle already
# disables this host row (the model-facing fs tools move to agent presets), so
# this row is an idempotent no-op there; on the CLI/TUI (base-only) profile it
# is what hands the whole fs tool family to the plugin at the host layer.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'
  disabled: true

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: true

# ── base-layer invariants this overlay relies on ────────────────────────────
#
# 0.2.0-rc.2 `@deepseek-ai/dsh-token-meter` declares
# `static inject = ['sessionProjections']` (packages/llm/token-meter/src/index.ts),
# and `ctx.goals` resolves through that same projections service, so
# `session-projection` and `token-meter` must stay mounted TOGETHER. The dsh-base
# bundle owns both rows (`session-projection`, `token-meter`) and this overlay
# disables neither, which is what the requirement asks for. Do not add a
# `disabled: true` row for either, and keep the pair together if this patch is
# ever layered onto a profile that does not inherit dsh-base.

# ── plugins ─────────────────────────────────────────────────────────────────
#
# `name` is a module specifier the Cordis Loader imports. Package names are
# resolved from the PROFILE directory's node_modules (`dsh plugin --profile
# web add <path>` installs each plugin there as a hoisted `link:` dependency,
# see README/run.ps1). Package names are REQUIRED for the browser to receive
# our client bundles: client-modules resolves every loader entry by package
# name from the profile dir, and a failed resolution is cached as a permanent
# negative verdict. The mode-ui package declares `dsh.client` and
# `exports["./client"]`, so its row also becomes a web boot entry.
# Build prerequisites: tree-engine, compact-mode, tool-read-write, advisor,
# channel-wechat and mode-ui (both faces) must be `pnpm run build` first
# (see README/run.ps1).
- insert:
    - id: compact-mode
      name: '@dsh-plugin/dsh-compact-mode'
      config:
        thresholdRatio: 0.6            # shake 后 >60% 提示进入 compact 模式
        keepRecentTokens: 20000        # shake 保护窗口
        minShakeSavingsRatio: 0.05     # 防空转
        summarizationProvider: ''      # 空 = 沿用最近请求路由
        summarizationModel: ''
        maxTokens: 8192
        promptOnThreshold: true        # 60% 时提示
        promptCooldown: 0              # 0 = 每会话每阈值一次
        promptOnHardOverflow: true     # 硬溢出提示+选项
        reviewTimeoutMs: 0             # 0 = 审阅不超时
        auto: true                     # 注册自动压力/溢出监听
        reviewTree: 'domain'           # 独立 domain 存储(web profile 已挂 storage-domain)
        readOnlyTools: []              # 保留字段(设计 §2.9 占位,compact-mode 不使用)

    # The omp-style read/write suite, replacing `@deepseek-ai/dsh-tool-fs`
    # wholesale (same-name read/write/edit/read_image + new inspect_image).
    # All config keys optional; `Config` supplies the defaults below, so no
    # `config` block is needed. The plugin registers the `tool:read` system
    # prompt section itself. Host-layer row: on the CLI/TUI profile it is the
    # replacement (tool-fs above is disabled); on the web profile it lands in
    # the global tool layer, visible to any agent whose preset does not mount
    # the stock tool-fs (see the `standard-rw` preset the preset-selection
    # section below selects).
    - id: tool-read-write
      name: '@dsh-plugin/dsh-tool-read-write'

    # Session advisor: reviewer model(s) attached to the primary session,
    # restricted to read/grep/glob (+ a scoped `advise` tool). immuneTurns
    # keeps successful concern/blocker deliveries from re-steering for 3
    # primary turns; syncBacklog 0 disables the bounded catch-up wait.
    - id: advisor
      name: '@dsh-plugin/dsh-advisor'
      config:
        enabled: true
        defaultTools: [read, grep, glob]
        immuneTurns: 3
        syncBacklog: 0

    # Orchestrator: the coordinator suite's review loop + recursive fan-out.
    # `subtask_parallel` dispatches N independent sub-tasks concurrently over the
    # shared dsh-worker-spawn base, behind three gates (`maxDepth`,
    # `maxTotalAgents`, and the `fanOut` heuristics). The review loop is a
    # customized goal CARRIED BY A DISPOSABLE REVIEW-WORK SUBAGENT (never by the
    # coordinator's own session): each round dispatches fresh one-shot clean
    # reviewers (read-only, composed by dsh-advisor's shared reviewer helper),
    # the verdict is the numeric count of accepted P0 findings, and the two exits
    # are zero-P0 → implement/verify → complete+report, and a human decision →
    # `goal.block` → wait → `goal.resume`.
    #
    # REQUIRES the goal stack (`goal`, `goal-round-driver`, `tool-goal`) and
    # `session-projection` to stay mounted — `ctx.goals` hard-depends on the
    # projection registry, exactly like `token-meter` (see the base-layer
    # invariants note above). Every key below is the plugin default; the
    # remaining knobs (`workerSpawn.provider/tiers/maxConsecutiveWakes`,
    # `workerTimeoutMs`, `reviewTimeoutMs`, `maxGoalRounds`) keep their defaults.
    - id: orchestrator
      name: '@dsh-plugin/dsh-orchestrator'
      config:
        reviewersPerRound: 3            # clean reviewers dispatched per round
        reviewerTools: [read, grep, glob]  # read-only envelope for those reviewers
        zeroP0Approach: 'count'         # numeric verdict, never a model's feeling
        fanOut:                         # the three recursive fan-out gates
          maxDepth: 3
          maxTotalAgents: 20
          minSubtasks: 2
          minEffortTokens: 2000

    # Mode-status Web UI: host projection units (compactMode/advisorStatus/
    # wechatChannel) + browser badges in the session header's
    # utilities band. All-default config; the client face is picked up from
    # this row's package declaration (`dsh.client` + `exports["./client"]`).
    - id: mode-ui
      name: '@dsh-plugin/dsh-mode-ui'
      config: {}

    # Review gate (`--review`): keeps every tool and fences only the WRITE
    # PATH. While a task awaits the user's plan approval, write/edit against
    # `protectedPaths` asks for approval through ctx.approval, the session
    # sandbox is tightened to `draftSandboxMode` at most (bash has no
    # path-level fence — that mode is the only lever), and the plan's scratch
    # dir stays writable. The flags are stripped at the user-input boundary;
    # the state rides the durable `review-gate/state` event and the
    # `reviewGate` projection. Every key below is the plugin default.
    - id: review-gate
      name: '@dsh-plugin/dsh-review-gate'
      config:
        protectedPaths: ['**/src/**', '**/*.ts', '**/*.tsx']
        scratchDir: '.dsh-plans'
        defaultPolicy: 'off'            # 'on' = every task starts behind the fence
        draftSandboxMode: 'workspace-write'  # '' = leave the session sandbox alone

    # WeChat (Tencent iLink) channel. Deliberately DISABLED for now — hermes
    # keeps the account (same iLink bot account is mutually exclusive; the
    # later starter gets 403s). The row is wired so activation is a config
    # flip: set `enabled: true`, stop the hermes gateway first, and point
    # `stateDir` at hermes's `weixin/` dir to reuse its accounts/pairing data
    # (omit it to use the plugin default `$DSH_HOME/wechat`).
    - id: channel-wechat
      name: '@dsh-plugin/dsh-channel-wechat'
      config:
        enabled: false

    # Asynchronous question inbox: durable `question/*` session events folded
    # into the `questionBoard` projection, the global `ask_question` tool, the
    # `ctx.questionBoard` service, and the panel's `/answer_question` /
    # `/dismiss_question` commands. Hard-injects `sessionProjections` (the
    # base bundle mounts `session-projection`, so no extra row is needed). All
    # default config. The Web face (`lib/client.js`, declared via dsh.client)
    # registers the `question-board` ConversationNode + its keyed renderer, so
    # the built bundle must exist before boot (design §5.4).
    - id: question-board
      name: '@dsh-plugin/dsh-question-board'
      config: {}

    # Rule layer (design §5.8 / §13.4), two deliberately separate halves.
    # Advisory: `advisoryFiles` are read once at mount and rendered as one
    # `rules:advisory` system-prompt section in the persona band (order 0),
    # registered with `interpolate: false` so literal braces in a rule file
    # survive. A missing file is skipped with a warning, so this row is safe
    # before `$DSH_HOME/AGENTS.md` / `$DSH_HOME/persona.md` exist.
    # Gate: `gateRules` become per-call approval gates (`tools/pre-execute`
    # listener + the `ctx.rules` service that review-gate/org consume). Empty
    # by default — the profile ships no protected paths of its own; add
    # `gateRules: [{ tool: write, paths: ['src/**'] }]` to arm it.
    - id: rules
      name: '@dsh-plugin/dsh-rules'
      config: {}

    # Task board (design §5.2 / §13.3): the coordinator's persistent
    # requirement-level ledger plus its attention work set. Durable `task/*`
    # events (whole-value snapshots, revision compare-and-set, replayable close
    # tombstones) fold into the `taskBoard` projection; the global
    # `task_new`/`task_update`/`task_close`/`task_reopen`/`task_list` tools are
    # granted per role through `tools.restrict({ allow: [...] })`; `ctx.taskBoard`
    # is the service. The `task-board/work-set` prompt section renders the
    # `inContext` task subjects under `maxContextBytes`, and a `tools/result`
    # observer completes `in_progress` tasks only when a successful result
    # carries one of `autoCloseSignals` (conservative: anything else waits for
    # the user). Values below are the plugin defaults. The browser half — this
    # row's package declaration (`dsh.client` + `exports["./client"]`) — adds
    # the `/task` command and the task-board chat node: the work set plus the
    # full ledger, per-row close/reopen and work-set checkbox, all driven
    # through `ctx.remote.commands`. NOTE: the `task/*` event
    # names must be in the harness persistence catalog for a session that used
    # them to reload — the same out-of-repo event-annex step the mode events
    # (`compact/mode`, …) needed; without it, resume refuses the log.
    - id: task-board
      name: '@dsh-plugin/dsh-task-board'
      config:
        maxContextBytes: 2000            # work-set prompt section budget (UTF-8 bytes)
        autoCloseSignals: [test-passed]  # [] disables auto-close entirely

# ── web preset selection ────────────────────────────────────────────────────
#
# `@deepseek-ai/dsh-agent-preset-registry` — 0.2.0-rc.2's rename of the removed
# `@deepseek-ai/dsh-agent-presets` package and of the web-app row that mounts
# it (row id `agent-preset-registry`) — picks the preset every NEW web session
# starts on. Its Config carries `default` plus the volatile `selectedDefault`
# the Web editor writes back.
#
# 0.2.0-rc.2 replaced the preset ROSTER with preset DECLARATIONS: the
# `$DSH_HOME/.agent-presets/<id>/` directory is no longer read by anything, and
# a preset is now a row of `@deepseek-ai/dsh-agent-preset` (config
# `{id, name, description, order, plugins}`) mounted from a bundle or a patch
# layer, exactly like the shipped `standard`/`ptc`/`minimal`/`cordis` rows in
# the web-app bundle. A preset id nobody declares fails loud at session
# creation, listing the available ids — the same fail-loud contract as the
# wechat config validation.
#
# MIGRATED: the declaration this `default` resolves to follows immediately
# below (the `- insert:` block row `preset-standard-rw`). It was re-authored
# from the former `profiles/main/agent-presets/standard-rw/` roster — `preset.yml`
# metadata plus the `agent.cordis.yml` rows VERBATIM, every plugin name
# re-checked against the 0.2.0-rc.2 inventory, because an unknown name fails the
# preset at mount instead of falling back to anything. The roster directory is
# gone: 0.2.0-rc.2 reads no roster, so keeping one would be dead weight.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard-rw

# ── standard-rw: the profile's own agent preset, as a DECLARATION ──────────
#
# 0.2.0-rc.2 replaced the preset ROSTER with preset DECLARATIONS: the old
# `agent-presets/standard-rw/` directory (`preset.yml` + `agent.cordis.yml`) is
# read by nothing, and a preset is now one `@deepseek-ai/dsh-agent-preset` row
# whose `config.plugins` carries the composition. This block is that row: the
# `plugins` list below IS the former `agent.cordis.yml` row list, verbatim
# (comments included), with the two 0.2.0-rc.2 corrections marked at their rows.
#
# `config.id` is what `agent-preset-registry`'s `default` resolves. `order: 5`
# places this preset after the four shipped ones (standard 1, ptc 2, minimal 3,
# cordis 4). `name`/`description` are the roster `preset.yml` metadata, published
# so the preset roster renders them instead of shipped locale copy.
#
# What makes this preset NOT the stock `standard`: the `tool-fs` row is absent
# (the profile's host-layer `tool-read-write` plugin owns the model-facing
# read/write/edit/read_image tools), and the `compaction-basic` + `command-compact`
# rows are absent (the profile's host-layer compact-mode plugin owns
# `ctx.compaction` and the `/compact*` command family). The per-row notes carried
# over from the roster say why the remaining rows sit where they do.
- insert:
    - id: preset-standard-rw
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard-rw
        name: standard-rw
        description: >-
          Standard mode, but the model-facing filesystem tools (read/write/edit/
          read_image/inspect_image) come from the profile's dsh-tool-read-write plugin
          instead of the stock @deepseek-ai/dsh-tool-fs (the `tool-fs` row is removed),
          and the stock compaction backend + /compact command are removed
          (`compaction-basic` and `command-compact` rows) so the profile's host-layer
          compact-mode plugin provides ctx.compaction and the /compact* command family.
          glob/grep, shell, skills, planning, goals, subagents and workflows are
          unchanged. Provided by the dsh-profile-main integration profile.
        order: 5
        plugins:
          # 0.2.0-rc.2 CORRECTION: the roster's `config.text` no longer exists.
          # `prefix` is required and `suffix` is the cwd sentence, split exactly
          # like the shipped `standard` preset — an empty suffix would shadow the
          # deployment suffix away. This row is the preset's own persona,
          # shadowing the deployment default for this agent.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: Your working directory is {{cwd}}.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # The stock `tool-fs` row is REMOVED in this preset: the profile's host-layer
          # `tool-read-write` plugin provides the model-facing read/write/edit/read_image
          # (+ inspect_image) tools, and a same-name row here would shadow them (and a
          # same-scope duplicate would throw). `tool-fs-search` stays: `glob`/`grep`
          # register no conflicting names and are the agent's discovery tools. All of
          # these register into the host `tools` registry and provide nothing, so they
          # need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane: the Gateway serves the goal domain as
          # Remote endpoints whose receiver comes from a generated descriptor, so it
          # resolves `goals` on the host and an entry-local realm here would hide it. The
          # registry is keyed by session anyway, so one host instance serves every
          # session. What a preset chooses is whether its agent can call the goal tool.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` and `command-compact` are REMOVED in this preset: the
          # profile's host-layer compact-mode plugin provides `ctx.compaction` (a
          # single-backend service — a second provider is a hard conflict) and registers
          # the `/compact*` command family (a duplicate `compact` registration would
          # otherwise throw). Removing both rows lets agents on this preset inherit the
          # host compact-mode engine and its commands instead of the stock basic
          # `/compact` + base compaction backend.
          #
          # `tool-result-pruner` stays: compact-mode's shake pass reads `toolResultPrune`
          # through `ctx.get`, so the pruner must share this realm rather than sit
          # outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all; this preset leaves that to the host compact-mode.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Product providers are host-plane singletons. Copy this preset, then
              # remove `disabled` from either ordinary tool row to expose that product
              # only to agents composed from the copy.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed

              # 0.2.0-rc.2 CORRECTION: the roster named
              # `@deepseek-ai/dsh-workflow-worker-thread`, which 0.2.0-rc.2 no
              # longer ships — the package (and the shipped `standard` preset's
              # row id) is now `workflow-ptc`. `provider: spawn` is unchanged.
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

# ── coordinator suite: session org + peers ───────────────────────────────────
#
# `dsh-peers` owns the peer channel: the durable `peer/message` event (appended
# to the TARGET session's log — that log IS the inbox), the `ctx.peers` send/
# list service with the self-built `senderId+messageId` dedup key, and the
# global `peer_send` tool. It is a separate package because the channel is
# meaningful without any org: any two live sessions may address each other.
#
# `dsh-org` owns the role model on top of it: the durable `org/*` events
# (`claim`/`relinquish`/`forbid`/`role`, plus `assign`/`notice`) folded into
# `ctx.org` and the `org` projection, the `/org on|off|claim|relinquish|
# forbid|list` command family, and the mechanism-enforced role capability
# envelope (tools.restrict allow-mask + scoped role tools + ONE
# tools/pre-execute path gate per role). Mount `peers` BEFORE `org`: the org
# envelope's allow-list is intersected with the tool names actually present,
# so `peer_send` must already be registered for a coordinator to receive it.
#
# Anchored at EOF (after the preset rows) to keep this insert clear of the
# other coordinator-suite rows' anchors.
- insert:
    # Peer channel. `wakeupEnabled: false` degrades every delivery to
    # inbox-only (quiet) without changing the tool surface — useful when the
    # target's turns must only ever start from human input.
    - id: peers
      name: '@dsh-plugin/dsh-peers'
      config:
        wakeupEnabled: true
        maxContentBytes: 16384

    # Session hierarchy. `handoffDir` is the one place a secretary may write
    # (the long task brief that a lead reads back); `secretaryBash: false` is
    # the deliberate hard guarantee behind "secretary cannot read code text":
    # bash has no path argument, so leaving it unmasked is the documented
    # best-effort gap (see doc/VERIFY-PATH-RESTRICT.md §4c). Set
    # `secretaryBash: true` only when the secretary needs shell exploration,
    # accepting that the read gradient becomes advisory. `strictTakeover:
    # true` re-asks the human (via `ctx.approval`) before a model-initiated
    # takeover of an existing session.
    #
    # The package also declares `dsh.client` + `exports["./client"]`, so this
    # row doubles as a web boot entry: client-modules serves the org panel
    # bundle (org 投影 → `conversation.input.dock`, 见 README「dsh-org 的组织面板」).
    # Build it (`pnpm --filter @dsh-plugin/dsh-org run build`) before a boot —
    # a missing lib/client.js fails loud at composition.
    - id: org
      name: '@dsh-plugin/dsh-org'
      config:
        handoffDir: '.dsh-handoff'
        secretaryBash: false
        strictTakeover: false
